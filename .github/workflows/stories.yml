name: Gerar imagens dos stories

on:
  push:
    branches: [main]
    paths: [noticias.json, posts/index.html, .github/workflows/stories.yml]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs separados por espaço (vazio = 5 mais recentes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: pip install pillow
      - name: Gerar JPEG dos stories das 5 notícias mais recentes
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          mkdir -p stories
          LISTA="${{ github.event.inputs.slugs }}"
          [ -z "$LISTA" ] && LISTA=$(python3 -c "import json;d=sorted(json.load(open('noticias.json')),key=lambda n:n['data'],reverse=True);print(' '.join(n['slug'] for n in d[:5]))")
          for slug in $LISTA; do
            if [ -f "stories/$slug.jpg" ] && [ -f "stories/$slug-feed.jpg" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then continue; fi
            google-chrome --headless=new --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
              --window-size=1080,1920 --virtual-time-budget=15000 \
              --log-level=3 --screenshot="/tmp/$slug.png" "http://localhost:8000/posts/?render=story&auto=1&n=$slug"
            python3 -c "from PIL import Image;import sys;Image.open(sys.argv[1]).convert('RGB').resize((1080,1920)).save(sys.argv[2],quality=90)" "/tmp/$slug.png" "stories/$slug.jpg"
            google-chrome --headless=new --no-sandbox --hide-scrollbars --force-device-scale-factor=1 \
              --window-size=1080,1350 --virtual-time-budget=15000 \
              --log-level=3 --screenshot="/tmp/$slug-feed.png" "http://localhost:8000/posts/?render=feed&n=$slug"
            python3 -c "from PIL import Image;import sys;Image.open(sys.argv[1]).convert('RGB').resize((1080,1350)).save(sys.argv[2],quality=90)" "/tmp/$slug-feed.png" "stories/$slug-feed.jpg"
            echo "gerado: stories/$slug.jpg e stories/$slug-feed.jpg"
          done
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories
          git diff --cached --quiet && exit 0
          git commit -m "Imagens dos stories"
          git push
