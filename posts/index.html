<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Posts para o Instagram | Fonte de Energia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:"Instrument Sans",system-ui,sans-serif;background:#f3f2ef;color:#0d0d10;padding:28px 4vw 80px}
  h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(34px,5vw,56px);letter-spacing:.01em;text-transform:uppercase}
  .sub{color:#666;margin:6px 0 26px;max-width:720px;line-height:1.5}
  .noticia{background:#fff;border-radius:22px;padding:22px;margin-bottom:28px}
  .noticia h2{font-size:20px;margin-bottom:4px}
  .meta{color:#777;font-size:14px;margin-bottom:18px}
  .grupo{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#888;margin:18px 0 10px}
  .fila{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
  .peca{flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
  .peca canvas{display:block;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.12);background:#ddd}
  .peca.feed canvas{width:min(300px,72vw);aspect-ratio:4/5;height:auto}
  .peca.story canvas{width:min(270px,62vw);aspect-ratio:9/16;height:auto}
  button{font:600 14px "Instrument Sans",sans-serif;border:0;border-radius:999px;padding:10px 16px;background:#0d0d10;color:#fff;cursor:pointer}
  button.claro{background:#eee;color:#0d0d10}
  textarea{width:100%;min-height:170px;border:1px solid #ddd;border-radius:14px;padding:14px;font:15px/1.5 "Instrument Sans",sans-serif;resize:vertical}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .aviso{font-size:13px;color:#a33;margin-top:6px}
</style>
</head>
<body>
<h1>Posts para o Instagram</h1>
<p class="sub">Artes prontas das últimas notícias do site. Toque em <b>Salvar</b> embaixo de cada imagem e poste. No story, cole o adesivo de link no espaço livre embaixo. No feed, poste as 3 imagens juntas.</p>
<div id="lista"></div>

<script>
const SETORES = {
  petroleo:   { nome: "Petróleo",   c: "#3b2bff", t: "#ffffff" },
  gas:        { nome: "Gás",        c: "#ff5a1f", t: "#ffffff" },
  luz:        { nome: "Luz",        c: "#ffd400", t: "#0d0d10" },
  hidrogenio: { nome: "Hidrogênio", c: "#00c2d8", t: "#0d0d10" },
  renovaveis: { nome: "Renováveis", c: "#19c37d", t: "#0d0d10" },
};
const DISPLAY = 'Anton, Impact, "Arial Narrow", sans-serif';
const TEXTO = '"Instrument Sans", system-ui, sans-serif';
const SITE = location.origin;

const largura = (u, w) => /[?&]w=\d+/.test(u) ? u.replace(/([?&]w=)\d+/, "$1" + w) : u;
const dataCurta = d => { const [a, m, dia] = d.split("-"); return `${+dia} ${["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][m - 1]} ${a}`; };

function carregarFoto(url) {
  return new Promise(res => {
    if (!url) return res(null);
    const i = new Image(); i.crossOrigin = "anonymous";
    i.onload = () => res(i); i.onerror = () => res(null);
    i.src = largura(url, 1600);
  });
}

function cobrir(ctx, img, w, h) {
  const r = Math.max(w / img.width, h / img.height), iw = img.width * r, ih = img.height * r;
  ctx.drawImage(img, (w - iw) / 2, (h - ih) / 2, iw, ih);
}

function quebrar(ctx, texto, max) {
  const linhas = []; let atual = "";
  for (const p of texto.split(/\s+/)) {
    const teste = atual ? atual + " " + p : p;
    if (ctx.measureText(teste).width > max && atual) { linhas.push(atual); atual = p; } else atual = teste;
  }
  if (atual) linhas.push(atual);
  return linhas;
}

function pilula(ctx, x, y, texto, fundo, cor, tam = 30, alinhar = "left") {
  ctx.font = `700 ${tam}px ${TEXTO}`;
  const t = texto.toUpperCase(), padX = tam * .75, h = tam * 1.9;
  ctx.letterSpacing = `${tam * .1}px`;
  const w = ctx.measureText(t).width + padX * 2;
  const x0 = alinhar === "right" ? x - w : x;
  ctx.fillStyle = fundo; ctx.beginPath(); ctx.roundRect(x0, y, w, h, h / 2); ctx.fill();
  ctx.fillStyle = cor; ctx.textBaseline = "middle"; ctx.fillText(t, x0 + padX, y + h / 2 + 1);
  ctx.letterSpacing = "0px";
  return h;
}

/* Capa com foto (feed 1080x1350 ou story 1080x1920) */
function capa(n, foto, w, h, story) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d"), s = SETORES[n.setor], M = 72;
  ctx.fillStyle = s.c; ctx.fillRect(0, 0, w, h);
  if (foto) cobrir(ctx, foto, w, h);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(story ? .3 : .25, "rgba(0,0,0,0)");
  g.addColorStop(story ? .55 : .55, "rgba(0,0,0,.55)");
  g.addColorStop(1, "rgba(0,0,0,.94)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  const topo = story ? 210 : M;
  pilula(ctx, M, topo, s.nome, s.c, s.t, 30);
  pilula(ctx, w - M, topo, "Fonte de Energia", "#0d0d10", "#fff", 26, "right");

  const fim = story ? h - 440 : h - M;   // story: espaço livre para o adesivo de link
  ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#fff";

  // rodapé
  ctx.font = `500 28px ${TEXTO}`; ctx.globalAlpha = .75;
  ctx.fillText(`${dataCurta(n.data)} · ${n.fontes[0].nome}`, M, fim); ctx.globalAlpha = 1;

  // título
  let tt = story ? 132 : 118, lt;
  do { ctx.font = `${tt}px ${DISPLAY}`; lt = quebrar(ctx, n.titulo.toUpperCase(), w - M * 2); tt -= 4; }
  while (lt.length > (story ? 5 : 4) && tt > 70);
  tt += 4;
  const y = fim - 54 - (lt.length - 1) * tt * 1.02;
  lt.forEach((l, i) => ctx.fillText(l, M, y + i * tt * 1.02));

  if (story) {
    // espaço reservado para o adesivo de link do Instagram
    const pw = 600, ph = 120, px = (w - pw) / 2, py = h - 300;
    ctx.font = `600 30px ${TEXTO}`; ctx.textAlign = "center"; ctx.globalAlpha = .85;
    ctx.fillText("Explicação completa no link", w / 2, py - 36);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.beginPath(); ctx.roundRect(px, py, pw, ph, ph / 2); ctx.fill();
    ctx.setLineDash([14, 12]); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.stroke(); ctx.setLineDash([]);
    ctx.textAlign = "left"; ctx.fillStyle = "#fff";
  }
  return cv;
}

/* Slides de texto do carrossel */
function slideTexto(n, titulo, corpo, numero, final) {
  const w = 1080, h = 1350, M = 80, s = SETORES[n.setor];
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = s.c; ctx.fillRect(0, 0, w, 18);

  pilula(ctx, M, 72, s.nome, s.c, s.t, 28);
  ctx.font = `600 26px ${TEXTO}`; ctx.fillStyle = "#999"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText(`${numero}/3`, w - M, 72 + 27); ctx.textAlign = "left";

  ctx.textBaseline = "alphabetic";
  let y = 200;
  const rodape = final ? 330 : 150;
  let tam = 58, linhas;
  do { ctx.font = `500 ${tam}px ${TEXTO}`; linhas = quebrar(ctx, corpo, w - M * 2); tam -= 2; }
  while (200 + linhas.length * (tam + 2) * 1.38 > h - rodape && tam > 30);
  const lh = (tam + 2) * 1.38;
  ctx.fillStyle = "#0d0d10";
  linhas.forEach(l => { y += lh; ctx.fillText(l, M, y); });

  if (final) {
    const by = h - 250;
    ctx.fillStyle = "#0d0d10"; ctx.beginPath(); ctx.roundRect(M, by, w - M * 2, 130, 28); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `700 34px ${TEXTO}`; ctx.textBaseline = "middle";
    ctx.fillText("Explicação completa e fonte original", M + 40, by + 46);
    ctx.font = `500 30px ${TEXTO}`; ctx.globalAlpha = .75;
    ctx.fillText(`no link da bio · Fonte: ${n.fontes[0].nome}`, M + 40, by + 90);
    ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  }
  ctx.font = `700 24px ${TEXTO}`; ctx.fillStyle = "#b0b0b0"; ctx.letterSpacing = "2.4px";
  ctx.fillText("FONTE DE ENERGIA", M, h - 70); ctx.letterSpacing = "0px";
  return cv;
}

function legenda(n) {
  const url = `${SITE}/n/${n.slug}/`;
  return `${n.titulo}\n\n${n.resumo}\n\nExplicação completa e link para a matéria original no site (link na bio).\n\nFonte: ${n.fontes.map(f => f.nome).join(", ")}\n\n#energia #${n.setor === "luz" ? "energiaeletrica" : n.setor}\n\n\nLink para o adesivo do story (não colar no post):\n${url}`;
}

async function salvar(cv, nome, aviso) {
  try {
    const blob = await new Promise((ok, er) => { try { cv.toBlob(b => b ? ok(b) : er(), "image/png"); } catch (e) { er(e); } });
    const arq = new File([blob], nome, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq] }); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  } catch (e) {
    if (e && e.name === "AbortError") return;
    aviso.textContent = "Não deu para salvar automaticamente. Tire um print da imagem.";
  }
}

function peca(cv, tipo, nome, rotulo) {
  const d = document.createElement("div"); d.className = "peca " + tipo;
  const av = document.createElement("div"); av.className = "aviso";
  const b = document.createElement("button"); b.textContent = "Salvar " + rotulo; b.onclick = () => salvar(cv, nome, av);
  d.append(cv, b, av); return d;
}

(async () => {
  await Promise.all([document.fonts.load(`80px Anton`), document.fonts.load(`500 40px "Instrument Sans"`), document.fonts.load(`700 40px "Instrument Sans"`)]).catch(() => {});
  const todas = await (await fetch("../noticias.json", { cache: "no-store" })).json();
  todas.sort((a, b) => b.data.localeCompare(a.data));
  const alvo = new URLSearchParams(location.search).get("n");
  const lista = alvo ? todas.filter(n => n.slug === alvo) : todas.slice(0, 3);
  const raiz = document.getElementById("lista");

  for (const n of lista) {
    const foto = await carregarFoto(n.foto);
    const [p1, p2 = ""] = (n.explicacao || n.resumo).split("\n\n");
    const box = document.createElement("section"); box.className = "noticia";
    box.innerHTML = `<h2>${n.titulo}</h2><div class="meta">${SETORES[n.setor].nome} · ${dataCurta(n.data)}</div>`;

    const g1 = document.createElement("div"); g1.className = "grupo"; g1.textContent = "Story";
    const f1 = document.createElement("div"); f1.className = "fila";
    f1.append(peca(capa(n, foto, 1080, 1920, true), "story", `${n.slug}-story.png`, "story"));

    const g2 = document.createElement("div"); g2.className = "grupo"; g2.textContent = "Feed · carrossel";
    const f2 = document.createElement("div"); f2.className = "fila";
    f2.append(
      peca(capa(n, foto, 1080, 1350, false), "feed", `${n.slug}-1.png`, "1/3"),
      peca(slideTexto(n, "", p1, 2, !p2), "feed", `${n.slug}-2.png`, "2/3"),
      peca(slideTexto(n, "", p2 || n.resumo, 3, true), "feed", `${n.slug}-3.png`, "3/3"),
    );

    const g3 = document.createElement("div"); g3.className = "grupo"; g3.textContent = "Legenda";
    const ta = document.createElement("textarea"); ta.value = legenda(n);
    const ac = document.createElement("div"); ac.className = "acoes";
    const bc = document.createElement("button"); bc.className = "claro"; bc.textContent = "Copiar legenda";
    bc.onclick = async () => { await navigator.clipboard.writeText(ta.value); bc.textContent = "Copiada ✓"; setTimeout(() => bc.textContent = "Copiar legenda", 1800); };
    ac.append(bc);

    box.append(g1, f1, g2, f2, g3, ta, ac);
    raiz.append(box);
  }
})();
</script>
</body>
</html>
