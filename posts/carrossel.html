<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Carrossel | Fonte de Energia</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f3f2ef;font-family:"Instrument Sans",sans-serif;padding:20px;display:flex;flex-direction:column;gap:16px;align-items:center}
  canvas{width:min(420px,92vw);height:auto;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
  body.render{padding:0;gap:0;background:#000}
  body.render canvas{width:1080px;height:1350px;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<script>
const SETORES = {
  petroleo:{nome:"Petróleo",c:"#3b2bff",t:"#fff"}, gas:{nome:"Gás",c:"#ff5a1f",t:"#fff"},
  luz:{nome:"Luz",c:"#ffd400",t:"#0d0d10"}, hidrogenio:{nome:"Hidrogênio",c:"#00c2d8",t:"#0d0d10"},
  renovaveis:{nome:"Renováveis",c:"#19c37d",t:"#0d0d10"}};
const D = 'Anton, Impact, "Arial Narrow", sans-serif', T = '"Instrument Sans", system-ui, sans-serif';
const W = 1080, H = 1350, M = 80;
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const dataLonga = d => { const [a,m,di] = d.split("-"); return `${+di} ${MESES[m-1]} ${a}`; };
const UN = /^(kWh|MWh|GWh|TWh|kW|MW|GW|TW|kV)([.,;:]?)$/;
const alta = t => t.split(" ").map(p => UN.test(p) ? p : p.toUpperCase()).join(" ");
const largura = (u,w) => /[?&]w=\d+/.test(u) ? u.replace(/([?&]w=)\d+/, "$1"+w) : u;
function foto(u){return new Promise(r=>{if(!u)return r(null);const i=new Image();i.crossOrigin="anonymous";i.onload=()=>r(i);i.onerror=()=>r(null);i.src=largura(u,1600);});}
function cobrir(c,img){const r=Math.max(W/img.width,H/img.height),iw=img.width*r,ih=img.height*r;c.drawImage(img,(W-iw)/2,(H-ih)/2,iw,ih);}
function quebrar(c,t,max){const l=[];let a="";for(const p of t.split(/\s+/)){const s=a?a+" "+p:p;if(c.measureText(s).width>max&&a){l.push(a);a=p;}else a=s;}if(a)l.push(a);return l;}
function pilula(c,x,y,txt,bg,cor,tam=28,dir=false){c.font=`700 ${tam}px ${T}`;c.letterSpacing=`${tam*.1}px`;const t=txt.toUpperCase(),px=tam*.75,h=tam*1.9,w=c.measureText(t).width+px*2,x0=dir?x-w:x;c.fillStyle=bg;c.beginPath();c.roundRect(x0,y,w,h,h/2);c.fill();c.fillStyle=cor;c.textBaseline="middle";c.fillText(t,x0+px,y+h/2+1);c.letterSpacing="0px";c.textBaseline="alphabetic";}
function novo(fundo){const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");c.fillStyle=fundo;c.fillRect(0,0,W,H);return [cv,c];}
function rodape(c,n,total,escuro){c.font=`700 24px ${T}`;c.letterSpacing="2.4px";c.fillStyle=escuro?"rgba(255,255,255,.6)":"#9a9a9a";c.fillText("FONTE DE ENERGIA",M,H-70);c.letterSpacing="0px";c.textAlign="right";c.font=`600 26px ${T}`;c.fillText(`${n}/${total}`,W-M,H-70);c.textAlign="left";}
function texto(c,t,x,y,max,tam,lh,cor){c.font=`500 ${tam}px ${T}`;c.fillStyle=cor;const l=quebrar(c,t,max);l.forEach((s,i)=>c.fillText(s,x,y+i*lh));return y+l.length*lh;}

function capa(tema,total){
  const [cv,c]=novo("#0d0d10");
  pilula(c,M,M,`Tema do dia · ${dataLonga(tema.data)}`,"#ffffff","#0d0d10",26);
  if(tema.capa_numero){
    let nt=300;c.font=`${nt}px ${D}`;while(c.measureText(tema.capa_numero).width>W-M*2&&nt>120){nt-=10;c.font=`${nt}px ${D}`;}
    c.fillStyle="#fff";c.fillText(tema.capa_numero,M-4,520);
    texto(c,tema.capa_texto,M,610,W-M*2,46,64,"rgba(255,255,255,.9)");
  }else{
    let tt=150,l;do{c.font=`${tt}px ${D}`;l=quebrar(c,alta(tema.titulo),W-M*2);tt-=6;}while(l.length>5&&tt>80);tt+=6;
    c.fillStyle="#fff";const y0=H/2-(l.length*tt*1.02)/2+tt*.8;l.forEach((s,i)=>c.fillText(s,M,y0+i*tt*1.02));
  }
  tema.noticias.map(n=>SETORES[n.setor].c).forEach((k,i)=>{c.fillStyle=k;c.fillRect(M+i*90,H-250,70,10);});
  c.font=`500 32px ${T}`;c.fillStyle="rgba(255,255,255,.8)";c.fillText(`3 notícias e uma leitura · por ${tema.autor}`,M,H-150);
  rodape(c,1,total,true);return cv;}

async function noticia(tema,i,total){
  const n=tema.noticias[i],s=SETORES[n.setor],[cv,c]=novo(s.c),img=await foto(n.foto);if(img)cobrir(c,img);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(.2,"rgba(0,0,0,0)");g.addColorStop(.5,"rgba(0,0,0,.6)");g.addColorStop(1,"rgba(0,0,0,.94)");c.fillStyle=g;c.fillRect(0,0,W,H);
  pilula(c,M,M,`${i+1} · ${s.nome}`,"#ffffff","#0d0d10",28);
  let yt;if(n.numero){yt=H-90;}else{c.font=`500 30px ${T}`;const lt=quebrar(c,n.texto,W-M*2);yt=H-150-(lt.length-1)*44;
  c.fillStyle="rgba(255,255,255,.92)";lt.forEach((x,k)=>c.fillText(x,M,yt+k*44));}
  let tt=96,l;do{c.font=`${tt}px ${D}`;l=quebrar(c,alta(n.titulo),W-M*2);tt-=4;}while(l.length>4&&tt>60);tt+=4;
  c.fillStyle="#fff";const yb=yt-(n.numero?40:60)-(l.length-1)*tt*1.02;l.forEach((x,k)=>c.fillText(x,M,yb+k*tt*1.02));
  if(n.numero){
    c.font=`500 34px ${T}`;const ll=quebrar(c,n.legenda||"",W-M*2);let yl=yb-tt-60-(ll.length-1)*46;
    c.fillStyle="rgba(255,255,255,.88)";ll.forEach((x,k)=>c.fillText(x,M,yl+k*46));
    let nt=220;c.font=`${nt}px ${D}`;while(c.measureText(n.numero).width>W-M*2&&nt>100){nt-=10;c.font=`${nt}px ${D}`;}
    c.fillStyle="#fff";c.fillText(n.numero,M-4,yl-64);
  }
  rodape(c,i+2,total,true);return cv;}

function leitura(tema,total){
  const [cv,c]=novo("#ffffff");c.fillStyle="#0d0d10";c.fillRect(0,0,W,18);
  pilula(c,M,M,"A leitura","#0d0d10","#fff",26);
  c.font=`96px ${D}`;c.fillStyle="#0d0d10";c.fillText("O QUE LIGA AS TRÊS",M,300);
  let tam=58;let fim;do{fim=texto(c,"",0,0,1,tam,1,"#fff");c.font=`500 ${tam}px ${T}`;fim=quebrar(c,tema.leitura,W-M*2).length*tam*1.4;tam-=2;}while(380+fim>H-180&&tam>30);tam+=2;
  texto(c,tema.leitura,M,400,W-M*2,tam,tam*1.4,"#1f1f23");
  rodape(c,total-1,total,false);return cv;}

function acompanhar(tema,total){
  const [cv,c]=novo("#ffffff");c.fillStyle="#0d0d10";c.fillRect(0,0,W,18);
  pilula(c,M,M,"Próximos capítulos","#0d0d10","#fff",26);
  c.font=`96px ${D}`;c.fillStyle="#0d0d10";c.fillText("O QUE ACOMPANHAR",M,300);
  let y=410;tema.acompanhar.forEach(([q,o])=>{c.fillStyle="#e4e2dc";c.fillRect(M,y-60,W-M*2,2);c.font=`700 30px ${T}`;c.fillStyle="#7a7a80";c.fillText(q.toUpperCase(),M,y);y=texto(c,o,M,y+56,W-M*2,44,58,"#0d0d10")+70;});
  c.font=`500 30px ${T}`;c.fillStyle="#555";c.fillText("As notícias completas estão no link do primeiro comentário.",M,H-150);
  rodape(c,total,total,false);return cv;}

(async()=>{
  await Promise.all([document.fonts.load("80px Anton"),document.fonts.load(`500 40px "Instrument Sans"`),document.fonts.load(`700 40px "Instrument Sans"`)]).catch(()=>{});
  const Q=new URLSearchParams(location.search);
  const temas=await (await fetch("temas.json",{cache:"no-store"})).json();
  const todas=await (await fetch("../noticias.json",{cache:"no-store"})).json();
  const tema=Q.get("d")?temas.find(t=>t.data===Q.get("d")):temas[temas.length-1];
  tema.noticias=tema.noticias.map(n=>({...todas.find(x=>x.slug===n.slug),...n}));
  const total=3+tema.noticias.length;
  const slides=[()=>capa(tema,total),...tema.noticias.map((_,i)=>()=>noticia(tema,i,total)),()=>leitura(tema,total),()=>acompanhar(tema,total)];
  const so=Q.get("slide");
  if(so){document.body.className="render";document.body.append(await slides[+so-1]());document.title="pronto";return;}
  for(const f of slides)document.body.append(await f());
})();
</script>
</body>
</html>
